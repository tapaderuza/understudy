modules:
  jira:globalPage:
    - key: understudy-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: Understudy

  jira:issuePanel:
    - key: understudy-issue-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Understudy
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  rovo:agent:
    - key: understudy-agent
      name: Understudy
      description: Hands over work before someone goes away and catches them up when
        they are back. Finds what must be covered, who already has the context,
        and briefs them.
      prompt: resource:agent-prompt;prompt.txt
      conversationStarters:
        - Prepare my handover for next week
        - Who should cover the work item I am looking at?
        - What do only I know about before I go on leave?
        - I'm back. What changed and what needs me first?
        - Where is our team's knowledge held by one person?
      actions:
        - get-handover-brief
        - suggest-stand-ins
        - publish-handover-page
        - brief-stand-in
        - brief-all-stand-ins
        - get-welcome-back-brief
        - get-team-knowledge-risk
        - request-walkthrough
      skills:
        - handover-planner
        - welcome-back
        - knowledge-risk

  rovo:skill:
    - key: handover-planner
      source:
        dir: skills/handover-planner
      dependencies:
        tools:
          - get-handover-brief
          - suggest-stand-ins
          - publish-handover-page
          - brief-stand-in
          - brief-all-stand-ins
    - key: welcome-back
      source:
        dir: skills/welcome-back
      dependencies:
        tools:
          - get-welcome-back-brief
    - key: knowledge-risk
      source:
        dir: skills/knowledge-risk
      dependencies:
        tools:
          - get-team-knowledge-risk
          - request-walkthrough

  rovo:mcp:
    - key: understudy-mcp
      name: Understudy handovers
      tools:
        - get-handover-brief
        - suggest-stand-ins
        - publish-handover-page
        - brief-stand-in
        - brief-all-stand-ins
        - get-welcome-back-brief
        - get-team-knowledge-risk
        - request-walkthrough

  action:
    - key: get-welcome-back-brief
      name: Get welcome-back brief
      function: welcome-fn
      actionVerb: GET
      description: >-
        For someone back from time away: work they own, reported or watch that
        others changed since they left, with mentions, reassignments and replies
        waiting listed first.
      inputs:
        person:
          title: Person
          type: string
          required: false
          description: "Display name or account ID of the person who is back. Empty or
            'me' means the current user."
        since:
          title: First day away
          type: string
          required: false
          description: "First day of the absence as YYYY-MM-DD. Defaults to 14 days ago."

    - key: get-handover-brief
      name: Get handover brief
      function: brief-fn
      actionVerb: GET
      description: >-
        Builds a handover brief for someone going away: open Jira work ranked by
        what must be covered, a suggested stand-in per item with evidence, work
        only they know, open pull requests, goals and pages.
      inputs:
        person:
          title: Person
          type: string
          required: false
          description: "Display name or Atlassian account ID of the person going away.
            Leave empty, or use 'me', for the current user."
        startDate:
          title: First day away
          type: string
          required: false
          description: "First day of the absence as YYYY-MM-DD. Defaults to today."
        endDate:
          title: Last day away
          type: string
          required: false
          description: "Last day of the absence, inclusive, as YYYY-MM-DD. Defaults to six
            days after the first day."

    - key: suggest-stand-ins
      name: Suggest stand-ins for a work item
      function: standins-fn
      actionVerb: GET
      description: >-
        Ranks who could cover one Jira work item while its assignee is away,
        with reasons: comments on it, work in the same epic or components, team,
        and how much they already carry.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: false
          description: "Jira work item key such as PAY-101. If empty, the work item the
            user is viewing is used."

    - key: publish-handover-page
      name: Publish handover page
      function: publish-fn
      actionVerb: CREATE
      description: >-
        Publishes the handover brief as a Confluence page in the given space and
        returns its link. Call only after the user confirms the space and the
        dates.
      inputs:
        spaceKey:
          title: Confluence space key
          type: string
          required: true
          description: "Key of the Confluence space where the page is created, for example
            TEAM."
        person:
          title: Person
          type: string
          required: false
          description: "Display name or account ID of the person going away. Empty or 'me'
            means the current user."
        startDate:
          title: First day away
          type: string
          required: false
          description: "First day of the absence as YYYY-MM-DD."
        endDate:
          title: Last day away
          type: string
          required: false
          description: "Last day of the absence, inclusive, as YYYY-MM-DD."
        standIns:
          title: Stand-ins chosen by the user
          type: string
          required: false
          description: "Only when the user changed a suggested stand-in: pairs of work item
            key and person, such as PAY-3=Max Taylor; PAY-5=Cassi Owens. Leave empty to
            use the suggestions."

    - key: brief-stand-in
      name: Brief a stand-in
      function: notify-fn
      actionVerb: CREATE
      description: >-
        Comments on a Jira work item to @-mention the stand-in with what they
        cover, why it matters and why they were picked, and adds them as a
        watcher. Call only after the user confirms both.
      inputs:
        standIn:
          title: Stand-in
          type: string
          required: true
          description: "Display name or account ID of the person who will cover the work
            item."
        issueKey:
          title: Work item key
          type: string
          required: false
          description: "Jira work item key such as PAY-101. If empty, the work item the
            user is viewing is used."
        note:
          title: Note
          type: string
          required: false
          description: "Optional context from the person going away, such as where the
            runbook is."
        startDate:
          title: First day away
          type: string
          required: false
          description: "First day of the absence as YYYY-MM-DD."
        endDate:
          title: Last day away
          type: string
          required: false
          description: "Last day of the absence, inclusive, as YYYY-MM-DD."

    - key: brief-all-stand-ins
      name: Brief all stand-ins
      function: brief-all-fn
      actionVerb: CREATE
      description: >-
        Briefs every stand-in in a handover plan at once (a comment per work
        item and a watcher); an earlier briefing for the same person is
        updated. Call only after the user confirms the plan.
      inputs:
        person:
          title: Person
          type: string
          required: false
          description: "Display name or account ID of the person going away. Empty or 'me'
            means the current user."
        startDate:
          title: First day away
          type: string
          required: false
          description: "First day of the absence as YYYY-MM-DD."
        endDate:
          title: Last day away
          type: string
          required: false
          description: "Last day of the absence, inclusive, as YYYY-MM-DD."
        standIns:
          title: Stand-ins chosen by the user
          type: string
          required: false
          description: "Only when the user changed a suggested stand-in: pairs of work item
            key and person, such as PAY-3=Max Taylor; PAY-5=Cassi Owens. Leave empty to
            use the suggestions."
        note:
          title: Note
          type: string
          required: false
          description: "Optional context for every stand-in, such as where the runbook is."

    - key: get-team-knowledge-risk
      name: Get team knowledge risk
      function: team-fn
      actionVerb: GET
      description: >-
        For one or more Jira projects: which open work items only one person
        has context on (single points of knowledge), how ready the team is to
        cover each person, and the colleague best placed to learn each item.
      inputs:
        projects:
          title: Projects
          type: string
          required: false
          description: "Jira project keys separated by commas, for example PAY, OPS. Empty
            means the projects of the current user's open work."

    - key: request-walkthrough
      name: Request a walkthrough
      function: walkthrough-fn
      actionVerb: CREATE
      description: >-
        Comments on a Jira work item to ask its assignee for a 15-minute
        walkthrough with a colleague, so someone else has context before
        anyone goes away, and adds the colleague as a watcher. Call only after
        the user confirms the work item and the colleague.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: false
          description: "Jira work item key such as PAY-101. If empty, the work item the
            user is viewing is used."
        learner:
          title: Colleague
          type: string
          required: true
          description: "Display name or account ID of the colleague who should learn the
            work item."
        note:
          title: Note
          type: string
          required: false
          description: "Optional context, such as a suggested time."

  trigger:
    - key: time-off-trigger
      function: leave-fn
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true

  function:
    - key: leave-fn
      handler: index.onLeaveItem
    - key: resolver
      handler: index.handler
    - key: brief-fn
      handler: index.getHandoverBrief
    - key: standins-fn
      handler: index.suggestStandIns
    - key: publish-fn
      handler: index.publishHandoverPage
    - key: notify-fn
      handler: index.briefStandIn
    - key: welcome-fn
      handler: index.getWelcomeBackBrief
    - key: brief-all-fn
      handler: index.briefAllStandInsAction
    - key: team-fn
      handler: index.getTeamKnowledgeRisk
    - key: walkthrough-fn
      handler: index.requestWalkthroughAction

resources:
  - key: main
    path: src/frontend/index.tsx
  - key: panel
    path: src/frontend/panel.tsx
  - key: agent-prompt
    path: resource/agent

permissions:
  scopes:
    # Jira: read work and people, write comments and watchers
    - read:jira-work
    - read:jira-user
    - write:jira-work
    # Confluence: find recent pages, list spaces, publish the handover page
    - search:confluence
    - read:space:confluence
    - write:page:confluence
    # Teamwork Graph (read-only): teams, goals, projects, work items, pull requests
    - read:graph:user:atlassian
    - read:graph:team:atlassian
    - read:graph:goal:atlassian
    - read:graph:project:atlassian
    - read:graph:issue:jira
    - read:graph:pull-request:external

app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/f822ce82-2fbb-4e00-878f-0798dda01b8c
  compatibility:
    jira:
      required: true
    confluence:
      required: false
